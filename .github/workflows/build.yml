name: Build Firmware
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt update && sudo apt install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip
      - run: |
          wget https://archive.openwrt.org/releases/18.06.9/targets/ar71xx/generic/openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64.tar.xz
          cd openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64
          make image PROFILE=tl-wa850re-v1 PACKAGES="-wpad-mini -wpad-basic wpad-wolfssl luci"
      - uses: actions/upload-artifact@v4
        with:
          name: eduroam-firmware
          path: openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64/bin/targets/ar71xx/generic/*sysupgrade.bin
